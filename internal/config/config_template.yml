# -----------------------------------------------------------------------------
# Core Defaults
# -----------------------------------------------------------------------------
# {{ index .Help "default-api" }}
default-api: openai
# {{ index .Help "default-model" }}
# default-model: your-model

# -----------------------------------------------------------------------------
# Formatting
# -----------------------------------------------------------------------------
# {{ index .Help "format-text" }}
format-text:
  markdown: '{{ index .Config.FormatText "markdown" }}'
  json: '{{ index .Config.FormatText "json" }}'
# {{ index .Help "format" }}
# format: markdown  # markdown, json, or a custom format-text key; empty = off
# {{ index .Help "minimal" }}
minimal: false

# -----------------------------------------------------------------------------
# Roles
# -----------------------------------------------------------------------------
# {{ index .Help "roles" }}
roles:
  "default": []
  # Example, a role called `shell`:
  # shell:
  #   - you are a shell expert
  #   - you do not explain anything
  #   - you simply output one liners to solve the problems you're asked
  #   - you do not provide any explanation whatsoever, ONLY the command
# {{ index .Help "role" }}
role: "default"

# -----------------------------------------------------------------------------
# Built-in Prompt Overrides
# -----------------------------------------------------------------------------
# {{ index .Help "prompts" }}
prompts:
  # {{ index .Help "prompts.identity" }}
  identity: ""
  # {{ index .Help "prompts.workflow" }}
  workflow: ""
  # {{ index .Help "prompts.tool-selection" }}
  tool-selection: ""

# -----------------------------------------------------------------------------
# Display and Output
# -----------------------------------------------------------------------------
# {{ index .Help "raw" }}
raw: false
# {{ index .Help "hide-tool-status" }}
hide-tool-status: false
# {{ index .Help "hide-chat-path" }}
hide-chat-path: false
# {{ index .Help "show-token-usage" }}
show-token-usage: false
# {{ index .Help "word-wrap" }}
word-wrap: 80
# {{ index .Help "theme" }}
theme: charm
# {{ index .Help "nerd-font-glyphs" }}
nerd-font-glyphs: false

# -----------------------------------------------------------------------------
# Model Parameters
# -----------------------------------------------------------------------------
# {{ index .Help "no-instructions" }}
no-instructions: false
# {{ index .Help "http-proxy" }}
# http-proxy: ""  # HTTP proxy for API requests
# {{ index .Help "max-retries" }}
max-retries: 5
# {{ index .Help "think" }}
think: false
# {{ index .Help "review-mode" }}
review-mode: auto

# -----------------------------------------------------------------------------
# Tools and MCP
# -----------------------------------------------------------------------------
# {{ index .Help "mcp-servers" }}
mcp-servers:
  # Example: GitHub MCP via Docker:
  # github:
  #   command: docker
  #   env:
  #     - GITHUB_PERSONAL_ACCESS_TOKEN=xxxyyy
  #   args:
  #     - run
  #     - "-i"
  #     - "--rm"
  #     - "-e"
  #     - GITHUB_PERSONAL_ACCESS_TOKEN
  #     - "ghcr.io/github/github-mcp-server"
  #
  # By default, mods filters obvious secrets out of the environment it
  # forwards to stdio MCP subprocesses (OPENAI_API_KEY, AWS_*,
  # GITHUB_TOKEN, MODS_*, anything matching *TOKEN/*SECRET/*PASSWORD/...).
  # The server's own env: block above is always forwarded verbatim, so
  # list only the variables the server actually needs. Set
  # pass-env-all: true to opt back into the legacy behaviour of leaking
  # the entire parent environment, only do that for fully trusted
  # local servers.
  #
  # For remote MCP servers (type: sse or http), URLs that target
  # loopback/private/link-local hosts are rejected. Set
  # MODS_MCP_ALLOW_PRIVATE=1 in the environment to opt in for local
  # development against a self-hosted MCP gateway.
# {{ index .Help "mcp-timeout" }}
mcp-timeout: 15s
# {{ index .Help "builtin-tools" }}
builtin-tools:
  # {{ index .Help "builtin-tools.filesystem" }}
  filesystem: auto
  # {{ index .Help "builtin-tools.shell" }}
  shell: true
  # {{ index .Help "builtin-tools.shell-timeout" }}
  shell-timeout: 60s
# {{ index .Help "web-search" }}
web-search: {{ .Config.WebSearch }}
# {{ index .Help "web-search-provider" }}
# Supported: tavily (default), deepseek, custom (or a custom endpoint URL)
web-search-provider: {{ .Config.WebSearchProvider }}
# {{ index .Help "web-search-api-key" }}
# web-search-api-key:
# {{ index .Help "web-search-api-key-env" }}
web-search-api-key-env: {{ .Config.WebSearchAPIKeyEnv }}
# For DeepSeek, set web-search-provider: deepseek and
# web-search-api-key-env: DEEPSEEK_API_KEY (or set web-search-api-key directly).

# {{ index .Help "skills-dirs" }}
# skills-dirs:
#   - ~/.agents/skills
#   - ./project-skills

# -----------------------------------------------------------------------------
# Debug
# -----------------------------------------------------------------------------
# {{ index .Help "debug" }}
debug: false

# =============================================================================
# APIs
# =============================================================================
# {{ index .Help "apis" }}
apis:

  # ---------------------------------------------------------------------------
  # Hosted Providers
  # ---------------------------------------------------------------------------
  openai:
    # The official api.openai.com endpoint uses the Responses API with
    # store: false. Encrypted response items needed for stateless reasoning
    # and tool continuation are persisted only in the local mods session.
    # A custom base-url continues to use Chat Completions.
    # {{ index .Help "apis.<provider>.base-url" }}
    base-url: https://api.openai.com/v1
    # {{ index .Help "apis.<provider>.api-key" }}
    api-key:
    # {{ index .Help "apis.<provider>.api-key-env" }}
    api-key-env: OPENAI_API_KEY
    # {{ index .Help "apis.<provider>.api-key-cmd" }}
    # api-key-cmd: rbw get -f OPENAI_API_KEY chat.openai.com

  # Sign in with mods --config; tokens are stored separately from this file.
  chatgpt:
    base-url: https://api.openai.com/v1

  google:
    # Optional override of the Gemini streaming endpoint. The default,
    # built by google.DefaultConfig, is the public
    # generativelanguage.googleapis.com URL with the model path embedded.
    # When you set base-url here, mods uses it verbatim unless you include
    # the literal token {model} (path-escaped substitution), useful for a
    # multi-model proxy that mirrors Google's URL structure. Single-model
    # proxies should write the full URL without a placeholder.
    # base-url: https://my-vertex-proxy.example.com/v1beta/models/{model}:streamGenerateContent?alt=sse

  anthropic:
    base-url: https://api.anthropic.com/v1
    api-key:
    api-key-env: ANTHROPIC_API_KEY
    # Anthropic always uses the Messages API. With -t, mods automatically
    # selects adaptive thinking for current Claude models and manual
    # budget_tokens for older extended-thinking models. Complete thinking,
    # signature, redacted_thinking, and tool_use blocks are kept in the local
    # session and replayed unchanged when tools continue a response.
    #
    # models:
    #   claude-opus-4-8:
    #     # Optional override. Recognized models do not normally need it.
    #     thinking-type: adaptive
    #     # Adaptive thinking maps this to output_config.effort. When omitted,
    #     Anthropic's model default is used.
    #     reasoning-effort: high
    #   claude-sonnet-4-5-20250929:
    #     thinking-type: enabled
    #     # Manual thinking requires at least 1024 tokens.
    #     thinking-budget: 8192

  azure:
    base-url: https://YOUR_RESOURCE_NAME.openai.azure.com
    api-key:
    api-key-env: AZURE_OPENAI_KEY

  github-copilot:
    # Run `mods --config` and choose GitHub Copilot to complete device
    # authentication. The wizard stores the resulting GitHub token here and
    # discovers available Copilot models automatically.
    base-url: https://api.githubcopilot.com
    api-key:

  deepseek:
    base-url: https://api.deepseek.com/
    api-key:
    api-key-env: DEEPSEEK_API_KEY
    # deepseek-v4-flash and deepseek-v4-pro automatically use the Responses
    # API on this official endpoint. Set endpoint: chat-completions on the
    # model to opt out.
    # Reasoning returned by DeepSeek Responses is plaintext and is persisted
    # in the local conversation database for stateless continuation.

  # GLM
  # Recent GLM models use thinking.type: "enabled" (Anthropic-style) and
  # return reasoning via the reasoning_content delta field (auto-captured).
  glm:
    base-url: https://open.bigmodel.cn/api/paas/v4
    api-key:
    api-key-env: ZAI_API_KEY

  # MiniMax
  # Uses thinking.type: "adaptive" (NOT "enabled") and inlines reasoning
  # in <think>...</think> tags within the content stream.
  minimax:
    base-url: https://api.minimaxi.com/v1
    api-key:
    api-key-env: MINIMAX_API_KEY

  # Qwen (Alibaba DashScope)
  # qwen-plus supports thinking via enable_thinking; mods maps -t / --think
  # to that provider-specific field.
  qwen:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key:
    api-key-env: DASHSCOPE_API_KEY

  # Kimi (Moonshot AI)
  # moonshot-v1 family does not expose thinking-mode controls.
  kimi:
    base-url: https://api.moonshot.cn/v1
    api-key:
    api-key-env: MOONSHOT_API_KEY

  # ---------------------------------------------------------------------------
  # Model Routers and Gateways
  # ---------------------------------------------------------------------------
  openrouter:
    base-url: https://openrouter.ai/api/v1
    api-key:
    api-key-env: OPENROUTER_API_KEY

  # ---------------------------------------------------------------------------
  # Local and Self-hosted Providers
  # ---------------------------------------------------------------------------
  ollama:
    base-url: http://localhost:11434

  # ---------------------------------------------------------------------------
  # Custom Provider Examples
  # ---------------------------------------------------------------------------
  # Example: custom OpenAI-compatible server
  # custom:
  #   base-url: https://your-server.com/v1
  #   api-key:
  #   api-key-env: CUSTOM_API_KEY
  #   models:
  #     your-model:
  #       aliases: ["ym"]
  #
  #       # Reasoning / Thinking configuration
  #       # These fields control how -t / --think on interacts with
  #       # the provider. All are optional with sensible defaults.
  #
  #       # thinking-type: override the provider default used by -t / --think.
  #       # Built-in providers usually do not need this. Custom OpenAI-compatible
  #       # providers commonly use enabled or adaptive; native Anthropic
  #       # Messages endpoints support adaptive, enabled, or disabled.
  #       thinking-type: enabled
  #
  #       # extra-params: arbitrary fields merged into the request body.
  #       # Official OpenAI expects Responses API field names; custom
  #       # OpenAI-compatible endpoints expect Chat Completions field names.
  #       # Provider-specific thinking toggles are normally handled by mods'
  #       # unified thinking policy; use this only for unsupported fields.
  #       extra-params:
  #         custom_field: custom_value
  #
  #       # thought-fields: override the delta fields consulted for reasoning
  #       # content extraction. Default: [reasoning_content, reasoning,
  #       # thinking, thinking_content].
  #       # thought-fields: [my_custom_field]
  #
  #       # think-tag: override the inline reasoning tag name.
  #       # Default: "think" renders as <think>...</think>. Only parsed when -t is on.
  #       # think-tag: reasoning
  #
  #       # reasoning-effort: target reasoning effort for -t. OpenAI defaults
  #       # to medium. Anthropic adaptive thinking maps this to
  #       # output_config.effort and omits it when not configured.
  #       # reasoning-effort: high
  #
  #       # reasoning-effort-off: override the reasoning_effort value sent
  #       # without -t. Known OpenAI models use model-aware defaults; set this
  #       # for opaque Azure deployment names or custom provider exceptions.
  #       # Common values: none, minimal, low.
  #       # reasoning-effort-off: none

  # Example: custom Anthropic-compatible server (speaks the Anthropic
  # Messages API, e.g. a Claude proxy or a third-party gateway). Set
  # api-type: anthropic so mods routes through the native Anthropic
  # adapter, including tool calling, reasoning/thinking, and image
  # support, regardless of the provider name. base-url may be the host
  # root, the host with /v1, or the full /v1/messages endpoint many
  # providers document. The adapter normalizes it so the path is never
  # doubled.
  # acme-claude:
  #   api-type: anthropic
  #   base-url: https://acme.example.com/v1
  #   api-key:
  #   api-key-env: ACME_API_KEY
  #   models:
  #     claude-sonnet-4:
  #       aliases: ["acme-sonnet"]
  #       # Opaque model names are not assumed to support thinking. Set this
  #       # explicitly when the compatible endpoint documents support.
  #       thinking-type: enabled
  #       thinking-budget: 8192
  #
  # api-type also works for the other native adapters: ollama, google,
  # azure. Omit it to use the OpenAI-compatible
  # adapter (the default for any unrecognized provider name).

  # OpenAI-compatible gateways can additionally declare a provider-profile.
  # api-type selects the wire protocol; provider-profile selects dialect
  # details such as thinking fields and Responses continuation data. It can be
  # set here as the provider default or overridden on an individual model.
  # company-router:
  #   api-type: openai
  #   provider-profile: openai
  #   base-url: https://gateway.example.com/v1
  #   api-key-env: COMPANY_ROUTER_KEY
  #   models:
  #     deepseek-v4-flash:
  #       provider-profile: deepseek
  #       endpoint: responses

  # The built-in qwen provider uses native image/audio/video encoding.
  # Custom gateways using that dialect can set provider-profile: qwen.
  # Keep the default Chat endpoint or explicitly select endpoint: responses.
  # The service decides whether the selected model accepts those media inputs;
  # no per-model media capability setting is required.

  # Example: a service that splits models across protocols. OpenCode's
  # Go gateway serves some models only via its OpenAI-compatible
  # endpoints (/v1/chat/completions for GLM, Kimi, DeepSeek, MiMo and
  # /v1/responses for GPT Luna, Grok, Muse Spark) and others only via
  # its Anthropic endpoint (/v1/messages for MiniMax, Qwen). mods models
  # one provider = one protocol, so configure TWO providers sharing the
  # same key, one per protocol; confirmed Responses models select
  # endpoint: responses automatically on official Go URLs. An explicit
  # endpoint always wins. (OpenRouter,
  # by contrast, serves every model through a single OpenAI-compatible
  # endpoint, so it needs only one provider.)
  #
  # opencode-go-anthropic: # Anthropic-protocol models (MiniMax, Qwen)
  #   api-type: anthropic
  #   base-url: https://opencode.ai/inference/go/anthropic/v1/messages
  #   api-key:
  #   api-key-env: OPENCODE_GO_API_KEY
  #   models:
  #     qwen3.7-plus:
  #       aliases: ["qwen-plus"]
  #     minimax-m3:
  #       aliases: ["minimax"]
  #
  # opencode-go:         # OpenAI Chat + Responses models
  #   base-url: https://opencode.ai/inference/go/openai/v1
  #   api-key:
  #   api-key-env: OPENCODE_GO_API_KEY
  #   models:
  #     glm-5.2:
  #       aliases: ["glm"]
  #     kimi-k2.7-code:
  #       aliases: ["kimi"]
  #     # Responses-only models (GPT Luna, Grok, Muse Spark) are served
  #     # on the same provider via the Responses API:
  #     gpt-6-luna:
  #       endpoint: responses # optional: selected automatically
