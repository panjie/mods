version: '3'

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build the mods binary with git version metadata.
    cmds:
      - go run ./internal/buildtask build

  release:
    desc: Build a stripped release binary with git version metadata.
    cmds:
      - go run ./internal/buildtask release

  install:
    desc: Build and install the mods binary.
    cmds:
      - go run ./internal/buildtask install

  uninstall:
    desc: Remove the installed mods binary.
    cmds:
      - go run ./internal/buildtask uninstall

  clean:
    desc: Remove build artifacts.
    cmds:
      - go run ./internal/buildtask clean

  check:
    desc: Verify that all packages compile.
    cmds:
      - go build ./...

  test:
    desc: Run the Go test suite.
    cmds:
      - go test ./...
      - go -C internal/huh test ./...

  test-blackbox-ai:
    desc: Run real-AI CLI black-box tests with the first available provider key.
    cmds:
      - go test -tags integration -v -count=1 -timeout=10m ./tests/blackbox

  test-windows-reliability-quick:
    desc: Run the short Windows real-machine reliability suite and write a report.
    platforms: [windows]
    cmds:
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows-reliability.ps1 -Mode quick -PowerShellHost auto

  test-windows-reliability-stress:
    desc: Run 100 iterations of the Windows real-machine reliability suite and write a report.
    platforms: [windows]
    cmds:
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows-reliability.ps1 -Mode stress -PowerShellHost auto

  ci:
    desc: Run the CI build and test baseline.
    cmds:
      - go build -v ./...
      # Windows PowerShell 5.1 bridge integration tests are intentionally real
      # process tests and can exceed 30s on ARM64 hardware.
      - go test -v -cover -timeout=90s ./...
      - go -C internal/huh test -v -cover -timeout=30s ./...
